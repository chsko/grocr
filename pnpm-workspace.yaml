# Dependency cooldown: never install a version published less than 7 days ago (in minutes), so
# a compromised release has time to be caught and pulled before it reaches this project.
minimumReleaseAge: 10080

# Install scripts are blocked unless listed here. esbuild (Convex CLI bundler) needs its script;
# the other two ship prebuilt binaries as optional dependencies, so their scripts stay off.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  unrs-resolver: false
