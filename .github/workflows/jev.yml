name: jev

# jev (TypeSafe System One) checks from GRO-14, run on every push to main. Both fail open if jev is
# unreachable. Before pushing, run `npm run jev:risk` locally (see scripts/ci/risk.mjs).

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  jev:
    name: Risk audit and nb/en parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Audit push risk
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/ci/risk.mjs "$BEFORE" "$AFTER"
      - name: Check changed nb/en strings
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/ci/i18n-parity.mjs "$BEFORE" "$AFTER"
