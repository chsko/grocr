name: jev

# jev (TypeSafe System One) checks from GRO-14. Both fail open if jev is unreachable.
#
# Security: this uses pull_request_target so the workflow and scripts always come from the base
# branch. A PR cannot change the gate it is judged by, and PR code is never checked out or run
# here; the scripts read the PR (files, patches, locale JSON) through the GitHub API only.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  # Label events must not cancel a scoring run in progress.
  group: >-
    jev-${{ github.event.pull_request.number }}-${{
    contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && 'labels' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  risk:
    name: PR risk gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Score risk with jev
        if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/pr-risk.mjs score
      - name: Require adversarial review for high-risk PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/pr-risk.mjs gate

  translations:
    name: nb/en translation parity
    if: github.event.action != 'labeled' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check changed strings with jev
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/i18n-parity.mjs
